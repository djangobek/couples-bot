services:
  postgres:
    image: postgres:17-alpine
    container_name: couples-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: couples
      POSTGRES_PASSWORD: couples
      POSTGRES_DB: couples
    ports:
      - "5432:5432"
    volumes:
      - couples_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U couples -d couples"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  couples_postgres_data:
